[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "atm-forcing"
version = "0.1.0"
requires-python = ">=3.10"
# NOTE: the regridding stack (esmf, esmpy, xesmf) is conda-forge only and is not
# listed here. Install it via conda first, then `uv pip install -e .` into that
# env (see README Installation).
dependencies = [
    "numpy",
    "pandas",
    "xarray[complete]",
    "matplotlib",
    "ipykernel",
    "scikit-learn",
    "sphinx",
    "sphinx_rtd_theme",
    "myst-parser",
    "siphon",
]

[project.optional-dependencies]
dev = ["ruff"]

[tool.setuptools.packages.find]
include = ["atm_forcing"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = [
  # zip-without-explicit-strict
  "B905"
]

# Ignore `E402` (import violations) in all `__init__.py` files, and in select subdirectories.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]
